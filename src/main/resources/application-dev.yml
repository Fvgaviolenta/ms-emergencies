spring:
  datasource:
    url: ${MS_EMERGENCIES_DB_URL:jdbc:postgresql://localhost:5432/catastrofescl_emergencies}
    username: ${MS_EMERGENCIES_DB_USER:catastrofescl}
    password: ${MS_EMERGENCIES_DB_PASSWORD:catastrofescl}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

catastrofescl:
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  auth:
    dev-mode: ${MS_EMERGENCIES_AUTH_DEV_MODE:true}
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001

logging:
  level:
    cl.catastrofescl.emergencies: DEBUG
    org.hibernate.SQL: INFO
    org.springframework.amqp: INFO

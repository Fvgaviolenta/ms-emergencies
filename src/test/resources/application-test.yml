spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

catastrofescl:
  rabbitmq:
    exchange-topic: catastrofescl.events
    exchange-dlx: catastrofescl.dlx
    cola-emergencia-creada: ms-emergencies.emergencia-creada
  firebase:
    enabled: false
  auth:
    dev-mode: true
  cors:
    allowed-origins:
      - http://localhost:3000

logging:
  level:
    org.hibernate.SQL: WARN
    org.testcontainers: WARN

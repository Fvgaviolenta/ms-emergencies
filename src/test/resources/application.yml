
spring:
  application:
    name: ms-emergencies
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    out-of-order: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8082
  servlet:
    context-path: /

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

# Configuracion especifica del dominio
catastrofescl:
  rabbitmq:
    exchange-topic: catastrofescl.events
    exchange-dlx: catastrofescl.dlx
    cola-emergencia-creada: ms-emergencies.emergencia-creada
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:catastrofecl-cc6bd}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:/secrets/catastrofecl-cc6bd-firebase-adminsdk-fbsvc-d9b70d6453.json}
  auth:
    dev-mode: false
    dev-trust-gateway-firebase-headers: false
    # Solo dev: ver application-dev / MS_EMERGENCIES_AUTH_DEV_FALLBACK_ROLE
    dev-fallback-role-for-unprivileged-token: ""
    # Roles por defecto cuando el gateway envía X-Firebase-Uid (separados por coma)
    dev-default-role-for-gateway: "AUTORIDAD,ADMINISTRADOR"
    public-paths:
      - /emergencies/active
      - /emergencies/active/geojson
      - /emergencies/active/centers
      - /announcements
      - /actuator/health
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
